services:
  # ── Backend API ──
  server:
    build: ./server
    container_name: hisabkitab-server
    restart: unless-stopped
    env_file:
      - ./server/.env
    expose:
      - "5000"
    networks:
      app-network:
        aliases:
          - server
          - hisabkitab-server
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ── Frontend (nginx) ──
  client:
    build:
      context: ./client
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
        VITE_API_URL: ${VITE_API_URL:-}
    container_name: hisabkitab-client
    restart: unless-stopped
    ports:
      - "8090:80"
    depends_on:
      - server
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
