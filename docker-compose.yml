services:
  # ── Backend API ──
  server:
    build: ./server
    container_name: hisabkitab-server
    restart: unless-stopped
    env_file:
      - ./server/.env
    expose:
      - "5000"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── Frontend (nginx) ──
  client:
    build:
      context: ./client
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
        VITE_API_URL: ${VITE_API_URL:-}
    container_name: hisabkitab-client
    restart: unless-stopped
    ports:
      - "8090:80"
    depends_on:
      - server
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
